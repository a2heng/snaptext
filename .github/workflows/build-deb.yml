name: SnapText CI

on:
  # Only tag pushes (v...) run CI: everyday branch commits must stay cheap.
  # Manually trigger via workflow_dispatch to verify without tagging.
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
    steps:
      # Install C++ build deps BEFORE checkout: containers have no git/qt/cmake.
      # Qt6 Widgets/Gui/Core/Dbus/Network come from qt6-base-dev; OpenCV from
      # libopencv-dev; onnxruntime is fetched separately (no distro package).
      # git is REQUIRED by actions/checkout@v5 (ubuntu:latest image has none);
      # ca-certificates needed for curl to download the onnxruntime prebuilt.
      - name: Install system dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential cmake curl ca-certificates git \
            qt6-base-dev libopencv-dev libx11-dev

      - uses: actions/checkout@v5

      # Timestamp mirrors PureVox: tag v* -> tag version (v2026.08.12.1517 -> 2026.08.12.1517),
      # else build time. Used for artifact naming so it matches the tag.
      - name: Set build timestamp (tag v* -> tag version; else now)
        id: ts
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            stamp="${GITHUB_REF_NAME#v}"
            stamp="${stamp//./-}"
            echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          else
            echo "stamp=$(date +'%Y-%m-%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

      # onnxruntime 无发行版系统包，拉预编译包到 third_party/（产物不入 git）
      - name: Fetch onnxruntime
        run: bash scripts/fetch-onnxruntime.sh

      - name: Package deb
        run: |
          bash pack-deb.sh
          ls -lh dist/snaptext-Linux-amd64-*.deb
          dpkg-deb --info dist/snaptext-Linux-amd64-*.deb | sed -n '1,14p'

      - name: Verify package contents
        run: |
          D=$(ls dist/snaptext-Linux-amd64-*.deb)
          dpkg-deb -c "$D" | grep -q 'opt/snaptext/snaptext$' && echo "binary OK"
          dpkg-deb -c "$D" | grep -q 'models/PP-OCRv6_rec_small.onnx' && echo "models OK"
          dpkg-deb -c "$D" | grep -q 'lib/libonnxruntime.so.1' && echo "onnxruntime OK"
          dpkg-deb -c "$D" | grep -q 'applications/io.github.a2heng.snaptext.desktop' && echo "desktop app_id OK"
          dpkg-deb -c "$D" | grep -qc 'snaptext\.png' >/dev/null && echo "icons OK"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: snaptext-Linux-amd64-${{ steps.ts.outputs.stamp }}-release
          path: dist/snaptext-Linux-amd64-*.deb
          if-no-files-found: error

  release:
    name: Release (tag -> attach deb)
    runs-on: ubuntu-latest
    needs: [linux]
    # Only when a tag is pushed (e.g. v2026.08.12.1517). The build job re-runs for
    # that exact ref so the release carries this tag's artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          files=$(find . -type f | sort | tr '\n' ' ')
          gh release create -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            --title "SnapText ${GITHUB_REF_NAME}" \
            --notes "自动发布：tag ${GITHUB_REF_NAME} 对应的 CI 构建产物（deb）。" \
            $files
